# FoxCloud config (draft schema, subject to change while the engine is built).

[remote]
# Preferred: name a Host entry from ~/.ssh/config. Host, port, user and key are
# read from it (via `ssh -G`), so credentials stay out of this file.
ssh_host = "foxbox"
#
# Alternative without an SSH config entry (Hetzner Storage Boxes use port 23).
# Anything set here overrides what the SSH config entry says.
# host = "uXXXXXX.your-storagebox.de"
# port = 23
# user = "uXXXXXX"
# key_file = "~/.ssh/foxcloud_ed25519"
#
# Verifies the server's host key. Defaults to the SSH config's known_hosts,
# else ~/.ssh/known_hosts. Connect once with ssh to record the key.
# known_hosts_file = "~/.ssh/known_hosts"
path = "/foxcloud"

[crypt]
encrypt_filenames = true
encrypt_directory_names = true
# Where the master key comes from; the crypt password and salt are derived
# from it. "keyring:<name>" reads the OS keyring (create it with
# `foxcloud secret generate`), anything else is a shell command that prints the
# key. Never put the key itself here.
key_command = "keyring:crypt-key"

[update]
# Once a day (and once after start-up) the daemon asks GitHub whether a newer
# release exists and says so in its log. It never installs anything; run
# `foxcloud update` for that. Set to false to make no network request at all.
check = true

# One table per job. Roles: push, pull, bisync, mount.
[[job]]
name = "data"
role = "push"
local_path = "~/Data"
interval = "15m"
watch = true                # push jobs only: sync 30s after files stop changing (no polling)
require_mount = ""          # sync only if this is a mount point
max_delete = 5
backup_dir = "~/Data.foxcloud-backup"
filter_file = "filters.txt"

# Laptop example:
# [[job]]
# name = "cloud"
# role = "mount"
# mount_point = "~/Cloud"     # Windows: a free drive letter such as "X:" (needs WinFsp);
#                             # Linux: an empty folder (needs fuse3)
# remote_path = ""            # mount only this folder of the remote; empty is all of it
# cache_mode = "full"         # off, minimal, writes or full
# cache_max_size = "100G"     # cap the on-disk cache; least recently used files go first
# The daemon keeps the mount up and retries a minute after it drops.
