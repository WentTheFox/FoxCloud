# Run from the repo root:  docker compose -f packaging/docker/compose.yml --env-file packaging/docker/.env up -d --build
# Secrets are passed as environment variables at run time (see .env.example);
# nothing secret is used during the image build. To use the published image,
# replace each `build:` block with  image: ghcr.io/wentthefox/foxcloud:latest
#
# Host prerequisite: a folder that can carry mounts between containers:
#   mkdir -p /srv/foxcloud-mount && mount --bind /srv/foxcloud-mount /srv/foxcloud-mount \
#     && mount --make-rshared /srv/foxcloud-mount
services:
  foxcloud:
    build:
      context: ../..
      args: { VERSION: docker }
    restart: unless-stopped
    environment:
      FOXCLOUD_CRYPT_KEY: ${FOXCLOUD_CRYPT_KEY:?set in .env}
      FOXCLOUD_SSH_KEY: ${FOXCLOUD_SSH_KEY:?set in .env}
      FOXCLOUD_KNOWN_HOSTS: ${FOXCLOUD_KNOWN_HOSTS:?set in .env}
      # Lets `docker exec <foxcloud> env -u RCLONE_RC rclone rc vfs/queue`
      # show pending uploads. Listens on 127.0.0.1 inside the container only
      # (not published); `env -u RCLONE_RC` stops the client from trying to
      # start a second server.
      RCLONE_RC: "true"
      # Uncomment to let other users (a non-root web UI container, say) read the
      # mount; without it only root in this container can. Verified with uid 1000.
      # RCLONE_ALLOW_OTHER: "true"
    # FUSE needs these to mount inside a container.
    devices: ["/dev/fuse:/dev/fuse"]
    cap_add: [SYS_ADMIN]
    security_opt: ["apparmor:unconfined"]
    # A web file manager (copyparty, say) can read and write the mount from a
    # service in THIS file, with the same rslave bind that rcd has below:
    #  - depends_on `service_healthy` only works inside one compose project, so
    #    keep such a service in the same file as foxcloud;
    #  - if it runs as a non-root user, set RCLONE_ALLOW_OTHER above;
    #  - keep its history/index folder on local disk, never on the mount, owned
    #    by its uid (a missing bind source is created as root), and leave
    #    indexing off so it does not scan the whole tree;
    #  - with copyparty/ac do not pass -c for /cfg: the image already loads
    #    /cfg/*.conf, and a second copy defines the volumes twice and exits.
    # Healthy once the mount is up (about 10 s after start). Anything that needs
    # the mount at start-up, such as a web file manager, should wait for it:
    #   depends_on: { foxcloud: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "mount | grep -q 'on /mnt/foxcloud/fox type fuse.rclone'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - ./config.toml:/config/config.toml:ro
      - foxcloud-state:/state          # also holds the capped write cache
      - type: bind                     # the shadow mount appears here on the host
        source: /srv/foxcloud-mount
        target: /mnt/foxcloud
        bind: { propagation: rshared }

  # rclone's remote-control server, for the Rclone UI app on the phone. It sees
  # the shadow mount at /data, so browsing, downloading and uploading all go
  # through it; it has no crypt or SFTP credentials of its own.
  rcd:
    build:
      context: ../..
      args: { VERSION: docker }
    restart: unless-stopped
    depends_on: { foxcloud: { condition: service_healthy } }
    entrypoint: ["rclone"]
    command: ["rcd", "--rc-addr=:5572"]
    environment:
      # Basic auth is required; never run rcd with --rc-no-auth.
      RCLONE_RC_USER: ${RCD_USER:?set RCD_USER in .env}
      RCLONE_RC_PASS: ${RCD_PASS:?set RCD_PASS in .env}
    ports:
      - "5572:5572"    # LAN/VPN only. For use over the internet, put a TLS reverse proxy in front.
    volumes:
      - type: bind
        source: /srv/foxcloud-mount
        target: /data
        bind: { propagation: rslave }

volumes:
  foxcloud-state:
