# FoxCloud config for a backup mirror (a Raspberry Pi, say). Mounted at
# /config/config.toml by compose.mirror.yml.
#
# A mirror copies a folder of the storage server ENCRYPTED, as it is. It never
# decrypts anything, so there is no crypt key here and none on this machine: if
# the Pi is stolen, the copy is as unreadable as the server's.
# To restore from it you still need the master key, so keep that backed up
# somewhere else (the desktop keyring is not a backup).

[remote]
host = "uXXXXXX.your-storagebox.de"
port = 23
user = "uXXXXXX"
key_file = "/tmp/foxcloud/ssh_key"          # written from $FOXCLOUD_SSH_KEY
known_hosts_file = "/tmp/foxcloud/known_hosts"   # written from $FOXCLOUD_KNOWN_HOSTS

[update]
mode = "off"          # the image is the update unit

[daemon]
startup_delay = "30s"

# One job per server folder. remote_path is the folder on the storage server
# exactly as it is named there, relative to the SSH login folder (it is NOT
# [remote] path and is not decrypted, so name the top-level folder of the
# FoxCloud instance you want to copy). local_path is where the ciphertext lands.
# Give every job its own local_path.
[[job]]
name = "mirror-main"
role = "mirror"
remote_path = "foxcloud"
local_path = "/backup/main"
backup_dir = "/backup/main-changed"   # files the server replaced or removed are kept here
interval = "6h"
max_delete = 20      # a pass that would remove more than this stops and waits for you

[[job]]
name = "mirror-photos"
role = "mirror"
remote_path = "foxcloud-photos"
local_path = "/backup/photos"
backup_dir = "/backup/photos-changed"
interval = "12h"
max_delete = 20
